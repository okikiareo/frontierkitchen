<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
  <link rel="stylesheet" href="css/product.css" />
  <link rel="stylesheet" href="css/main.css" />
  <title>Document</title>
</head>

<body>
  <section class="product-sect">
    <header id="header">
      <div class="container">
        <div class="logo">Frontier Kitchen</div>

        <ul class="nav">
          <li class="nav-close"><i class="fas fa-times"></i></li>
          <li><a href="/index.html">Home</a></li>
        </ul>

        <div class="menu_btn"><i class="fas fa-bars"></i></div>
      </div>
    </header>
    <div class="container">
      <div class="prod-head-section flex">
        <div class="prod-head">
          <p>your appliances</p>
          <h2>Right Here</h2>
        </div>
      </div>
      <!-- Products  -->
      <div class="products">
        <div class="product-inner">
          <div class="type-btn">
            <button data-filter="all" class="active-btn">All</button>
            <button data-filter="microwave">Microwave</button>
            <button data-filter="burner">Burners</button>
            <button data-filter="heater">Heaters</button>
          </div>
          <!-- Products Grid -->
          <div class="prod-show">
            <div class="product-item microwave">
              <div> <img src="/assets/microwaveoven.jpg" alt="Microwave"></div>
              <p class="prod-name">Microwave2023</p>
              <p class="prod-descrip">Fast, efficient and durable</p>
            </div>
            <div class="product-item burner">
              <img src="/assets/gashubburner.jpg" alt="Burner">
              <p class="prod-name">Gas Burner X</p>
              <p class="prod-descrip">Powerful and safe</p>
            </div>
            <div class="product-item heater">
              <img src="/assets/gashubburner.jpg" alt="Burner">
              <p class="prod-name">Gas Burner X</p>
              <p class="prod-descrip">Powerful and safe</p>
            </div>
            <div class="product-item burner">
              <img src="/assets/gashubburner.jpg" alt="Burner">
              <p class="prod-name">Gas Burner X</p>
              <p class="prod-descrip">Powerful and safe</p>
            </div>
            <div class="product-item microwave">
              <img src="/assets/microwaveoven.jpg" alt="Microwave">
              <p class="prod-name">Microwave2023</p>
              <p class="prod-descrip">Fast, efficient and durable</p>
            </div>
            <!-- Repeat product-item divs as needed -->
          </div>
        </div>
      </div>

  </section>
  <script src="js/product.js"></script>
  <script src="js/main.js"></script>
</body>

</html>
